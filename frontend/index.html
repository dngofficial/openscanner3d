<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Object scanner</title>
<style>
  :root { --bg:#14161a; --panel:#1e2126; --line:#353a41; --ink:#ece8df; --dim:#9a9d9f; --ok:#3fb8a0; --warn:#e3a53c; --bad:#e2604c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, sans-serif; padding:24px 16px; }
  main { max-width:1100px; margin:0 auto; display:grid; gap:20px; }
  h1 { font-size:24px; margin:0; } h2 { font-size:17px; margin:0 0 10px; }
  section { background:var(--panel); border-radius:8px; padding:18px; }
  .connect { display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:start; }
  @media (max-width:700px) { .connect { grid-template-columns:1fr; } }
  #qr svg { display:block; width:220px; height:220px; border-radius:6px; }
  #qr:empty { display:none; }
  code { background:#0f1114; padding:2px 6px; border-radius:4px; word-break:break-all; }
  .problem { color:var(--warn); margin:4px 0; }
  .scan { border-top:1px solid var(--line); padding:14px 0; display:grid; grid-template-columns:150px 1fr; gap:16px; }
  .scan:first-of-type { border-top:0; }
  .scan canvas { width:150px; height:150px; }
  .meta { color:var(--dim); font-size:14px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  a, button { font:inherit; color:var(--ink); }
  a.button, button { background:#2a2e34; border:1px solid #4a4f57; border-radius:6px; padding:8px 12px; text-decoration:none; cursor:pointer; }
  button.go { background:var(--ok); border-color:var(--ok); color:#06201b; font-weight:600; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:6px; margin-top:10px; }
  .thumbs img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:4px; background:#000; }
  .state-ready { color:var(--ok); } .state-failed, .state-interrupted { color:var(--bad); } .state-running { color:var(--warn); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Object scanner</h1>
  <section>
    <h2>Connect your phone</h2>
    <div class="connect">
      <div id="qr" aria-label="QR code with the phone link"></div>
      <div>
        <p id="connectHelp">Loading…</p>
        <div id="problems"></div>
        <p id="urls"></p>
        <p class="meta">The phone must be on the same Wi-Fi and trust this laptop's certificate once (see docs/PHONE_SETUP.md). The link contains a key that changes every time the scanner starts.</p>
      </div>
    </div>
  </section>
  <section>
    <h2>Scans</h2>
    <div id="scans"><p class="meta">No scans yet. Start one from the phone.</p></div>
  </section>
</main>
<script type="module">
import { drawCoverage } from '/guidance.mjs';
const $ = id => document.getElementById(id);
let plan = null, mode = 'capture';
const open = new Set();

async function json(path, options) {
  const response = await fetch(path, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail || `Request failed (${response.status})`);
  return body;
}

async function loadConnect() {
  try {
    const info = await json('/api/connect');
    mode = info.mode;
    $('qr').innerHTML = info.qr_svg || '';
    $('connectHelp').textContent = info.urls.length && info.lan
      ? 'Scan this QR code with the phone camera, or open the link below in Safari / Chrome on the phone.'
      : 'The phone cannot connect yet:';
    $('problems').replaceChildren(...info.problems.map(text => Object.assign(document.createElement('p'), { className: 'problem', textContent: text })));
    $('urls').replaceChildren(...(info.lan ? info.urls : []).map(url => { const c = document.createElement('code'); c.textContent = url; return c; }));
  } catch (error) {
    $('connectHelp').textContent = 'Open this page on the laptop itself (localhost) to see the phone link.';
  }
}

function card(scan) {
  const row = document.createElement('div'); row.className = 'scan';
  const canvas = document.createElement('canvas'); canvas.width = canvas.height = 300;
  drawCoverage(canvas.getContext('2d'), 300, plan, scan.coverage.counts);
  const body = document.createElement('div');
  const status = scan.status ? ` · reconstruction: <span class="state-${scan.status.state}">${scan.status.state}</span>` : '';
  body.innerHTML = `<strong>${scan.id}</strong> ${scan.finished ? '' : '<span class="state-running">(capturing)</span>'}
    <div class="meta">${scan.photos.length} photos · ${scan.coverage.have} of ${scan.coverage.wanted} angles${scan.coverage.unguided ? ` · ${scan.coverage.unguided} without angle data` : ''}${status}</div>
    <div class="meta">${scan.status?.message || ''}</div>`;
  const actions = document.createElement('div'); actions.className = 'actions';
  for (const file of scan.files) {
    actions.append(Object.assign(document.createElement('a'), { className: 'button', href: `/scans/${scan.id}/${file}`, textContent: `Download ${file}` }));
  }
  if (scan.finished && mode === 'reconstruct' && scan.status?.state !== 'running') {
    const go = Object.assign(document.createElement('button'), { className: 'go', textContent: 'Reconstruct' });
    go.onclick = async () => {
      go.disabled = true;
      try { await json(`/api/scans/${scan.id}/reconstruct`, { method: 'POST' }); } catch (error) { alert(error.message); }
      refresh();
    };
    actions.append(go);
  }
  const toggle = Object.assign(document.createElement('button'), { textContent: open.has(scan.id) ? 'Hide photos' : 'Show photos' });
  toggle.onclick = () => { open.has(scan.id) ? open.delete(scan.id) : open.add(scan.id); refresh(); };
  if (scan.photos.length) actions.append(toggle);
  body.append(actions);
  if (open.has(scan.id)) {
    const thumbs = document.createElement('div'); thumbs.className = 'thumbs';
    thumbs.append(...scan.photos.map(photo => Object.assign(document.createElement('img'), {
      src: `/scans/${scan.id}/images/${photo.name}`, loading: 'lazy',
      alt: photo.ring === null ? photo.name : `${photo.name}, ${['low', 'mid', 'high'][photo.ring]} angle, side ${photo.sector + 1}` })));
    body.append(thumbs);
  }
  row.append(canvas, body);
  return row;
}

async function refresh() {
  try {
    plan ??= await json('/api/plan');
    const scans = await json('/api/scans');
    if (scans.length) $('scans').replaceChildren(...scans.map(card));
  } catch { /* keep the last view; the server may be restarting */ }
}
loadConnect(); refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
