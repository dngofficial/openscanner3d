# Copy to config.local.toml. Paths belong to the machine running the server.
# Capture uses CPU OpenCV; it does not attempt dense reconstruction.
mode = "capture"

# On the partner's GPU laptop set mode = "reconstruct" after running doctor.
# Use actual executable paths if the tools are not on PATH.
# TOML single-quoted strings preserve Windows backslashes.
colmap = 'colmap'
blender = 'blender'

# Dense-stereo image size: low = 1000 px, medium = 1600 px, high = 2400 px (COLMAP presets).
# Phone photos are 1920 px or more, so low throws most detail away. Drop to low if 8 GB VRAM runs out.
quality = "medium"
timeout_seconds = 1800
max_photos = 100

# Phone capture: lan = true serves https://<laptop Wi-Fi address>:8443 for the phone.
# Needs the certificate from: .venv/Scripts/python.exe -m scripts.make_cert (see docs/PHONE_SETUP.md).
lan = false
port = 8443
tls_cert = 'certs/lan.pem'
tls_key = 'certs/lan-key.pem'
