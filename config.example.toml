# Copy to config.local.toml. Paths belong to the machine running the server.
# Capture uses CPU OpenCV; it does not attempt dense reconstruction.
mode = "capture"

# On the partner's GPU laptop set mode = "reconstruct" after running doctor.
# Use actual executable paths if the tools are not on PATH.
# TOML single-quoted strings preserve Windows backslashes.
colmap = 'colmap'
blender = 'blender'

# Initial bounded preset, not a guarantee of fitting in 8 GB VRAM.
quality = "low"
timeout_seconds = 1800
max_photos = 100

# Fractional [x0, y0, x1, y1] regions where no features are detected, live or in COLMAP.
# Omitting the key uses the built-in default, which covers the Camo free-tier watermark
# (measured on 1280x720 frames; recheck at other resolutions). Use [] for unwatermarked photos.
# Masks steer pose estimation only; dense reconstruction still sees the full image.
# feature_mask_regions = [[0.875, 0.785, 0.975, 0.975]]

# AI object selection (SAM 2) runs as a separate process. See models/README.md for setup.
# Leave segmentation_python empty to use the server's interpreter, or point it at a PyTorch venv.
# segmentation_python = '.venv-sam2/Scripts/python.exe'
# sam2_checkpoint = 'models/sam2.1_hiera_tiny.pt'
# sam2_config = "configs/sam2.1/sam2.1_hiera_t.yaml"
# segmentation_device = "auto"   # auto, cuda, or cpu
